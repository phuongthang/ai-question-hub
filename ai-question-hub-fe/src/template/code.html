<!DOCTYPE html>

                        "on-primary-fixed-variant": "#0f4780",
                        "tertiary-fixed-dim": "#f1bf5d",
                        "surface-variant": "#e2e2e7",
                        "surface-dim": "#d9dadf",
                        "surface-container-high": "#e8e8ed",

                        "on-tertiary-fixed-variant": "#5e4200",
                        "glass-white-heavy": "rgba(255, 255, 255, 0.85)",
                        "surface-container-low": "#f3f3f9",
                        "on-tertiary-fixed": "#271900",
                        "hero-end": "#243558",
                        "accent-coral": "#E45B76",
                        "accent-emerald": "#10B981",
                        "secondary-container": "#a7ccff",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#e2e2e7",
                        "bg-base": "#F0F3FA",
                        "glass-white": "rgba(255, 255, 255, 0.70)",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2e3035",
                        "bg-gradient": "linear-gradient(135deg, #D5DEEF 0%, #F0F3FA 100%)",
                        "primary": "#2e5d97",

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px) saturate(160%);
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .bg-gradient-custom {
            background: linear-gradient(135deg, #D5DEEF 0%, #F0F3FA 100%);
        }
        .blob-1 {
            background: rgba(98, 142, 203, 0.4);
            filter: blur(80px);
        }
        .blob-2 {
            background: rgba(138, 174, 224, 0.3);
            filter: blur(80px);
        }
    </style>
</head>
<body class="bg-gradient-custom min-h-screen flex items-center justify-center relative overflow-hidden font-body text-body text-on-surface">
<!-- Decorative Blobs -->
<div class="absolute top-0 right-0 w-[600px] h-[600px] rounded-full blob-1 -translate-y-1/4 translate-x-1/4 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-[500px] h-[500px] rounded-full blob-2 translate-y-1/4 -translate-x-1/4 pointer-events-none"></div>
<!-- Registration Card -->
<div class="glass-card rounded-[24px] w-full max-w-[480px] p-xl shadow-lg relative z-10 m-page-padding">
<!-- Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center gap-xs mb-sm">
<div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-primary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-lg">psychology</span>
</div>
<span class="font-display-sm text-display-sm text-primary">AI Q-Gen</span>
</div>
<h1 class="font-display-lg text-display-lg text-ink mb-xxs">Tạo tài khoản</h1>
<p class="font-body text-body text-ink-muted">Tham gia để quản lý dự án &amp; sinh câu hỏi bằng AI</p>
</div>
<!-- Form -->
<form class="space-y-md">
<div class="space-y-xxs">
<label class="font-body-strong text-body-strong text-ink-secondary block" for="fullName">Full name</label>
<input class="w-full bg-glass-white/80 border border-glass-border-subtle rounded-lg px-md py-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary-light transition-all backdrop-blur-md" id="fullName" placeholder="Nguyen Van A" type="text"/>
</div>
<div class="space-y-xxs">
<label class="font-body-strong text-body-strong text-ink-secondary block" for="username">Username</label>
<input class="w-full bg-glass-white/80 border border-glass-border-subtle rounded-lg px-md py-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary-light transition-all backdrop-blur-md" id="username" placeholder="nguyenvana" type="text"/>
</div>
<div class="space-y-xxs">
<label class="font-body-strong text-body-strong text-ink-secondary block" for="email">Email</label>
<input class="w-full bg-glass-white/80 border border-error rounded-lg px-md py-sm focus:outline-none focus:ring-1 focus:ring-error-container transition-all backdrop-blur-md text-error" id="email" placeholder="nguyenvana@example.com" type="email" value="invalid-email"/>
<p class="font-caption text-caption text-error flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[14px]">error</span>
                    Email không hợp lệ
                </p>
</div>
<div class="space-y-xxs">
<label class="font-body-strong text-body-strong text-ink-secondary block" for="password">Password</label>
<div class="relative">
<input class="w-full bg-glass-white/80 border border-glass-border-subtle rounded-lg px-md py-sm pr-10 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary-light transition-all backdrop-blur-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-muted hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="space-y-xxs">
<label class="font-body-strong text-body-strong text-ink-secondary block" for="confirmPassword">Confirm password</label>
<div class="relative">
<input class="w-full bg-glass-white/80 border border-glass-border-subtle rounded-lg px-md py-sm pr-10 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary-light transition-all backdrop-blur-md" id="confirmPassword" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-muted hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary-hover text-white font-body-strong text-body-strong rounded-full py-sm px-xl shadow-[0_4px_14px_0_rgba(98,142,203,0.39)] hover:shadow-[0_6px_20px_rgba(98,142,203,0.23)] hover:-translate-y-[1px] active:scale-[0.98] transition-all duration-200 mt-md" type="submit">
                Đăng ký
            </button>
</form>
<!-- Footer -->
<div class="mt-lg text-center">
<div class="relative flex py-sm items-center mb-sm">
<div class="flex-grow border-t border-glass-border-subtle"></div>
<span class="flex-shrink-0 mx-4 font-caption text-caption text-ink-muted">hoặc</span>
<div class="flex-grow border-t border-glass-border-subtle"></div>
</div>
<p class="font-body text-body text-ink-secondary">
                Đã có tài khoản? 
                <a class="font-body-strong text-body-strong text-primary hover:text-primary-hover hover:underline transition-colors" href="#">Đăng nhập</a>
</p>
</div>
</div>
</body></html>
