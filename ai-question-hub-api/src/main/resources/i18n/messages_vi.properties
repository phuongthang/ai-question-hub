# =========================================================================
# L\u1ed7i x\u00e1c th\u1ef1c & ph\u00e2n quy\u1ec1n (E0001 - E0005)
# =========================================================================
E0001=Th\u00f4ng tin \u0111\u0103ng nh\u1eadp kh\u00f4ng h\u1ee3p l\u1ec7. Vui l\u00f2ng ki\u1ec3m tra t\u00ean \u0111\u0103ng nh\u1eadp v\u00e0 m\u1eadt kh\u1ea9u.
E0002=Token kh\u00f4ng h\u1ee3p l\u1ec7 ho\u1eb7c \u0111\u00e3 b\u1ecb gi\u1ea3 m\u1ea1o.
E0003=Token \u0111\u00e3 h\u1ebft h\u1ea1n.
E0004=B\u1ea1n kh\u00f4ng c\u00f3 quy\u1ec1n truy c\u1eadp t\u00e0i nguy\u00ean n\u00e0y.
E0005=T\u00e0i kho\u1ea3n c\u1ee7a b\u1ea1n \u0111\u00e3 b\u1ecb v\u00f4 hi\u1ec7u h\u00f3a ho\u1eb7c b\u1ecb kh\u00f3a.

# =========================================================================
# L\u1ed7i validate d\u1eef li\u1ec7u \u0111\u1ea7u v\u00e0o (E0006 - E0017)
# =========================================================================
E0006=T\u00ean \u0111\u0103ng nh\u1eadp kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng.
E0007=T\u00ean \u0111\u0103ng nh\u1eadp ph\u1ea3i t\u1eeb 3 \u0111\u1ebfn 50 k\u00fd t\u1ef1.
E0008=\u0110\u1ecba ch\u1ec9 email kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng.
E0009=Vui l\u00f2ng nh\u1eadp \u0111\u1ecba ch\u1ec9 email h\u1ee3p l\u1ec7.
E0010=M\u1eadt kh\u1ea9u kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng.
E0011=M\u1eadt kh\u1ea9u ph\u1ea3i c\u00f3 \u00edt nh\u1ea5t 8 k\u00fd t\u1ef1.
E0012=H\u1ecd v\u00e0 t\u00ean kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng.
E0013=H\u1ecd v\u00e0 t\u00ean ph\u1ea3i t\u1eeb 3 \u0111\u1ebfn 100 k\u00fd t\u1ef1.
E0014=S\u1ed1 \u0111i\u1ec7n tho\u1ea1i kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng.
E0015=\u0110\u1ecbnh d\u1ea1ng s\u1ed1 \u0111i\u1ec7n tho\u1ea1i kh\u00f4ng h\u1ee3p l\u1ec7.
E0016=M\u00e3 OTP kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u1ec3 tr\u1ed1ng.
E0017=M\u00e3 OTP ph\u1ea3i c\u00f3 \u0111\u00fang 6 ch\u1eef s\u1ed1.

# =========================================================================
# L\u1ed7i ng\u01b0\u1eddi d\u00f9ng (E0101 - E0106)
# =========================================================================
E0101=Kh\u00f4ng t\u00ecm th\u1ea5y ng\u01b0\u1eddi d\u00f9ng.
E0102=T\u00ean \u0111\u0103ng nh\u1eadp \u0111\u00e3 t\u1ed3n t\u1ea1i trong h\u1ec7 th\u1ed1ng.
E0103=\u0110\u1ecba ch\u1ec9 email \u0111\u00e3 t\u1ed3n t\u1ea1i trong h\u1ec7 th\u1ed1ng.
E0104=Th\u00f4ng tin ng\u01b0\u1eddi d\u00f9ng kh\u00f4ng h\u1ee3p l\u1ec7.
E0105=M\u00e3 OTP kh\u00f4ng h\u1ee3p l\u1ec7.
E0106=M\u00e3 OTP \u0111\u00e3 h\u1ebft h\u1ea1n.

# =========================================================================
# L\u1ed7i h\u1ec7 th\u1ed1ng (E9001 - E9003)
# =========================================================================
E9001=\u0110\u00e3 x\u1ea3y ra l\u1ed7i h\u1ec7 th\u1ed1ng kh\u00f4ng mong mu\u1ed1n. Vui l\u00f2ng th\u1eed l\u1ea1i sau.
E9002=L\u1ed7i k\u1ebft n\u1ed1i c\u01a1 s\u1edf d\u1eef li\u1ec7u.
E9003=D\u1eef li\u1ec7u \u0111\u1ea7u v\u00e0o kh\u00f4ng h\u1ee3p l\u1ec7.

# =========================================================================
# Th\u00f4ng tin x\u00e1c th\u1ef1c (I0001 - I0005)
# =========================================================================
I0001=\u0110\u0103ng nh\u1eadp th\u00e0nh c\u00f4ng.
I0002=\u0110\u0103ng k\u00fd t\u00e0i kho\u1ea3n th\u00e0nh c\u00f4ng.
I0003=\u0110\u0103ng xu\u1ea5t th\u00e0nh c\u00f4ng.
I0004=N\u1ebfu email t\u1ed3n t\u1ea1i trong h\u1ec7 th\u1ed1ng, m\u00e3 OTP \u0111\u1eb7t l\u1ea1i m\u1eadt kh\u1ea9u \u0111\u00e3 \u0111\u01b0\u1ee3c g\u1eedi.
I0005=M\u1eadt kh\u1ea9u \u0111\u00e3 \u0111\u01b0\u1ee3c \u0111\u1eb7t l\u1ea1i th\u00e0nh c\u00f4ng.

# =========================================================================
# Th\u00f4ng tin ng\u01b0\u1eddi d\u00f9ng (I0101 - I0104)
# =========================================================================
I0101=L\u1ea5y th\u00f4ng tin ng\u01b0\u1eddi d\u00f9ng th\u00e0nh c\u00f4ng.
I0102=T\u1ea1o ng\u01b0\u1eddi d\u00f9ng th\u00e0nh c\u00f4ng.
I0103=C\u1eadp nh\u1eadt th\u00f4ng tin ng\u01b0\u1eddi d\u00f9ng th\u00e0nh c\u00f4ng.
I0104=X\u00f3a ng\u01b0\u1eddi d\u00f9ng th\u00e0nh c\u00f4ng.
