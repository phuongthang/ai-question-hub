# =========================================================================
# Authentication / Authorization Errors (E0001 - E0005)
# =========================================================================
E0001=Invalid credentials. Please check your username and password.
E0002=Invalid or tampered token.
E0003=Token has expired.
E0004=You do not have permission to access this resource.
E0005=Your account has been disabled or locked.

# =========================================================================
# Field Validation Errors (E0006 - E0017)
# =========================================================================
E0006=Username must not be blank.
E0007=Username must be between 3 and 50 characters.
E0008=Email must not be blank.
E0009=Please enter a valid email address.
E0010=Password must not be blank.
E0011=Password must be at least 8 characters long.
E0012=Full name must not be blank.
E0013=Full name must be between 3 and 100 characters.
E0014=Phone number must not be blank.
E0015=Invalid phone number format.
E0016=OTP code must not be blank.
E0017=OTP code must be exactly 6 digits.

# =========================================================================
# User Errors (E0101 - E0106)
# =========================================================================
E0101=User not found.
E0102=Username already exists.
E0103=Email already exists.
E0104=Invalid user information.
E0105=Invalid OTP code.
E0106=OTP code has expired.

# =========================================================================
# System Errors (E9001 - E9003)
# =========================================================================
E9001=An unexpected system error occurred. Please try again later.
E9002=Database connection error.
E9003=Invalid input data.

# =========================================================================
# Authentication Info Messages (I0001 - I0005)
# =========================================================================
I0001=Login successful.
I0002=Registration successful.
I0003=Logout successful.
I0004=If the email exists in our system, a password reset OTP has been sent.
I0005=Password has been reset successfully.

# =========================================================================
# User Info Messages (I0101 - I0104)
# =========================================================================
I0101=User information retrieved successfully.
I0102=User created successfully.
I0103=User information updated successfully.
I0104=User deleted successfully.
