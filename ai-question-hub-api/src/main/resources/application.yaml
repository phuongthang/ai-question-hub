server:
  port: 9001
spring:
  application:
    name: ai-question-hub-api
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_qestion_hub
    username: aiquestionhub
    password: aiquestionhub
    driver-class-name: org.postgresql.Driver
    flyway:
      enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aiquestionhub.aiquestionhubapi
  configuration:
    map-underscore-to-camel-case: true
